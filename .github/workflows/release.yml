name: Build and publish Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        id: version
        run: |
          [xml]$project = Get-Content src/BorderLess.App/BorderLess.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" *> $null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0
      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.exists != 'true'
        with:
          dotnet-version: '10.0.403'
      - name: Prepare installer compiler
        if: steps.version.outputs.exists != 'true'
        run: ./scripts/Prepare-InstallerCompiler.ps1
      - name: Build packages
        if: steps.version.outputs.exists != 'true'
        run: ./scripts/Build-Installer.ps1
      - name: Verify protocol and files
        if: steps.version.outputs.exists != 'true'
        run: |
          dotnet run --project tests/BorderLess.Tests/BorderLess.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Protocol tests failed' }
      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '^(BorderLess-|SHA256-)' } | ForEach-Object FullName)
          gh release create "v$env:RELEASE_VERSION" @assets --target $env:GITHUB_SHA --title "BorderLess $env:RELEASE_VERSION" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
